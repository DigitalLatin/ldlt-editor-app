services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    working_dir: /site
    volumes:
      - .:/site
      - bundle_cache:/usr/local/bundle
    ports:
      - "127.0.0.1:4000:4000"
    command:
      - bash
      - -lc
      - |
        bundle install &&
        bundle exec jekyll serve \
          --host 0.0.0.0 \
          --port 4000 \
          --no-watch

volumes:
  bundle_cache: